<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portfolio | Rudar Sharma{% endblock %}</title>
    <link rel="icon" type="image/png" href="/src/assets/hero-avatar.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');
        
        :root { --plum: #DDA0DD; --dark: #050505; }
        
        /* FIX: Ensure vertical scrolling works and horizontal is killed */
        html, body {
            margin: 0; padding: 0;
            width: 100%; min-height: 100%;
            overflow-x: hidden; overflow-y: auto;
            background-color: var(--dark);
            color: #f1f1f1;
            font-family: 'Outfit', sans-serif;
        }

        .font-serif { font-family: 'Playfair Display', serif; }
        .text-plum { color: var(--plum); }

        /* Glassmorphism Classes */
        .glass-header {
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-pill {
            background: rgba(221, 160, 221, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(221, 160, 221, 0.2);
        }

        .nav-link { 
            position: relative; font-size: 0.75rem; letter-spacing: 0.2em; 
            text-transform: uppercase; font-weight: 700; 
            transition: all 0.3s ease-in-out;
        }
        .nav-link:hover { 
            color: var(--plum); 
        }
        /* Underline fade-in effect */
        .nav-link::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 1.5px;
            bottom: -6px;
            left: 0;
            background-color: var(--plum);
            transform-origin: bottom right;
            transition: transform 0.3s ease-in-out;
        }
        .nav-link:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }

        /* Smooth lift and glow transition for glass cards and buttons */
        .glass-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px -10px rgba(221, 160, 221, 0.15), 0 0 25px 0 rgba(221, 160, 221, 0.1);
            border-color: rgba(221, 160, 221, 0.3);
        }

        .glass-pill {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-pill:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(221, 160, 221, 0.3);
        }

        /* Elegant fade-in slide up animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 3D transformation utility helpers */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .group-hover\:rotate-y-180:hover, .group:hover .group-hover\:rotate-y-180 { transform: rotateY(180deg); }

        /* ==========================================
           CUSTOM ACCENT SCROLLBAR SYSTEM
           ========================================== */

        /* Modern Standard CSS (Firefox) */
        * {
          scrollbar-width: thin;
          scrollbar-color: #a855f7 #09090b; /* Orchid Purple Thumb // Deep Zinc Track */
        }

        /* WebKit Browsers (Chrome, Safari, Edge, Opera) */
        ::-webkit-scrollbar {
          width: 10px;  /* Vertical scrollbar width */
          height: 10px; /* Horizontal scrollbar height */
        }

        /* The background track of the scrollbar */
        ::-webkit-scrollbar-track {
          background: #09090b;
          border-left: 1px solid #18181b; /* Subtle separator line */
        }

        /* The moving draggable handle */
        ::-webkit-scrollbar-thumb {
          background: #27272a; /* Starts as a subtle dark zinc */
          border-radius: 9999px;
          border: 2px solid #09090b; /* Creates a clean padding effect around the thumb */
          transition: background-color 0.2s ease;
        }

        /* Hover interaction state */
        ::-webkit-scrollbar-thumb:hover {
          background: #a855f7; /* Glows into vibrant orchid purple on hover */
        }

        /* Active click/drag state */
        ::-webkit-scrollbar-thumb:active {
          background: #c084fc; /* Lightens slightly to bright purple when dragging */
        }

        /* ==========================================
           CUSTOM DUAL-CIRCLE ORCHID CURSOR
           ========================================== */
        html, body, a, button, input, select, textarea, [role="button"], .swiper-slide, label {
          cursor: none !important;
        }

        #cursor-dot {
          position: fixed;
          top: 0; left: 0;
          width: 8px; height: 8px;
          background: #a855f7;
          border-radius: 50%;
          pointer-events: none;
          z-index: 99999;
          transform: translate(-50%, -50%);
          transition: opacity 0.2s ease;
          box-shadow: 0 0 8px rgba(168, 85, 247, 0.8);
        }

        #cursor-ring {
          position: fixed;
          top: 0; left: 0;
          width: 32px; height: 32px;
          border: 1.5px solid rgba(168, 85, 247, 0.45);
          border-radius: 50%;
          pointer-events: none;
          z-index: 99998;
          transform: translate(-50%, -50%);
          transition: width 0.2s ease, height 0.2s ease, border-color 0.2s ease,
                      background 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
          /* The ring position uses a CSS transition for the lag effect */
          left: 0; top: 0;
        }

        #cursor-ring.hovered {
          width: 48px; height: 48px;
          border-color: rgba(168, 85, 247, 0.85);
          background: rgba(168, 85, 247, 0.07);
          box-shadow: 0 0 18px rgba(168, 85, 247, 0.25);
        }

        #cursor-dot.hidden-cursor, #cursor-ring.hidden-cursor {
          opacity: 0;
        }

        /* ==========================================
           AMBIENT ORB BACKGROUND ANIMATIONS
           ========================================== */

        @keyframes orbOne {
          0%   { transform: translate(0px, 0px) scale(1); }
          33%  { transform: translate(30px, -50px) scale(1.1); }
          66%  { transform: translate(-20px, 20px) scale(0.95); }
          100% { transform: translate(0px, 0px) scale(1); }
        }

        @keyframes orbTwo {
          0%   { transform: translate(0px, 0px) scale(1); }
          50%  { transform: translate(-40px, 60px) scale(1.05); }
          100% { transform: translate(0px, 0px) scale(1); }
        }

        @keyframes orbThree {
          0%   { transform: translate(0px, 0px) scale(1); }
          33%  { transform: translate(-10px, -40px) scale(0.9); }
          66%  { transform: translate(40px, 20px) scale(1.1); }
          100% { transform: translate(0px, 0px) scale(1); }
        }

        .animate-orb-one   { animation: orbOne   22s infinite ease-in-out; }
        .animate-orb-two   { animation: orbTwo   28s infinite ease-in-out; }
        .animate-orb-three { animation: orbThree 25s infinite ease-in-out; }

    </style>
</head>
<body>

        <div class="absolute top-[10%] left-[5%] w-[300px] h-[300px] bg-plum/10 blur-[100px] rounded-full pointer-events-none"></div>

                    <span class="text-[10px] font-mono font-bold text-plum/60 tracking-wider">01 /</span>

                <div class="flex items-center gap-4">
                    <span class="text-[10px] font-mono font-bold text-plum/60 tracking-wider">02 /</span>
                    <span class="text-base font-bold uppercase tracking-[0.15em] text-white/70 group-hover:text-plum transition-colors">Projects</span>

            <a href="/stats" class="group flex items-center justify-between w-full px-6 py-4 rounded-[1.25rem] glass-card border-white/5 hover:border-plum/30 transition-all duration-300 hover:scale-[1.03] hover:bg-white/[0.02]">
                <div class="flex items-center gap-4">
                    <span class="text-[10px] font-mono font-bold text-plum/60 tracking-wider">03 /</span>
                    <span class="text-base font-bold uppercase tracking-[0.15em] text-white/70 group-hover:text-plum transition-colors">Stats</span>

                    <span class="text-[10px] font-mono font-bold text-plum/60 tracking-wider">05 /</span>

    <!-- Custom Dual-Circle Orchid Cursor DOM Elements -->
    <div id="cursor-dot"></div>
    <div id="cursor-ring"></div>

    <main>{% block content %}{% endblock %}</main>

    <footer class="py-20 px-10 border-t border-white/5 text-center">
        <p class="text-white/20 text-[10px] uppercase tracking-[0.4em]">© 2026 Rudar Sharma</p>
    </footer>

    <script>
        // Mobile Hamburger Menu Toggle Logic (Full-Screen Glass Overlay)
        document.addEventListener('DOMContentLoaded', () => {
            const menuToggle = document.getElementById('menu-toggle');
            const mobileOverlay = document.getElementById('mobile-overlay');
            const menuIcon = document.getElementById('menu-icon');
            
            if (menuToggle && mobileOverlay && menuIcon) {
                menuToggle.addEventListener('click', () => {
                    const isClosed = mobileOverlay.classList.contains('hidden');
                    if (isClosed) {
                        // Open Overlay Menu
                        mobileOverlay.classList.remove('hidden');
                        mobileOverlay.classList.add('flex');
                        // Force brief reflow and trigger high-performance fade transition
                        setTimeout(() => {
                            mobileOverlay.classList.add('opacity-100');
                            mobileOverlay.classList.remove('opacity-0');
                        }, 10);
                        menuIcon.className = 'fas fa-times transition-all duration-300 rotate-90';
                        document.body.style.overflow = 'hidden'; // Lock background scrolling
                    } else {
                        // Close Overlay Menu
                        mobileOverlay.classList.add('opacity-0');
                        mobileOverlay.classList.remove('opacity-100');
                        // Delay hidden to allow transition to play
                        setTimeout(() => {
                            if (mobileOverlay.classList.contains('opacity-0')) {
                                mobileOverlay.classList.add('hidden');
                                mobileOverlay.classList.remove('flex');
                            }
                        }, 500);
                        menuIcon.className = 'fas fa-bars transition-all duration-300';
                        document.body.style.overflow = ''; // Unlock background scrolling
                    }
                });
            }
        });

        function copyCloneLink(link, button) {
            navigator.clipboard.writeText(link).then(() => {
                const originalText = button.textContent;
                button.textContent = 'Copied cloning link';
                button.style.backgroundColor = 'var(--plum)';
                button.style.color = 'black';
                
                setTimeout(() => {
                    button.textContent = originalText;
                    button.style.backgroundColor = '';
                    button.style.color = '';
                }, 2000);
            });
        }
    </script>

    <!-- ========================================
         CUSTOM CURSOR SCRIPT
         ======================================== -->
    <script>
      (function () {
        const dot  = document.getElementById('cursor-dot');
        const ring = document.getElementById('cursor-ring');

        // Ring position — updated with a slight JS lag via rAF lerp
        let mouseX = 0, mouseY = 0;
        let ringX  = 0, ringY  = 0;
        const LERP = 0.12; // lower = more lag (0–1)

        function lerp(a, b, t) { return a + (b - a) * t; }

        function animateRing() {
          ringX = lerp(ringX, mouseX, LERP);
          ringY = lerp(ringY, mouseY, LERP);
          ring.style.left = ringX + 'px';
          ring.style.top  = ringY + 'px';
          requestAnimationFrame(animateRing);
        }
        requestAnimationFrame(animateRing);

        // Track mouse — dot moves instantly
        document.addEventListener('mousemove', (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
          dot.style.left = e.clientX + 'px';
          dot.style.top  = e.clientY + 'px';
          dot.classList.remove('hidden-cursor');
          ring.classList.remove('hidden-cursor');
        });

        // Hide when mouse leaves viewport
        document.addEventListener('mouseleave', () => {
          dot.classList.add('hidden-cursor');
          ring.classList.add('hidden-cursor');
        });
        document.addEventListener('mouseenter', () => {
          dot.classList.remove('hidden-cursor');
          ring.classList.remove('hidden-cursor');
        });

        // Hover scaling on interactive elements
        const SELECTORS = 'a, button, input, select, textarea, [role="button"], label, .custom-prev, .custom-next, .swiper-slide';

        function bindHovers() {
          document.querySelectorAll(SELECTORS).forEach((el) => {
            if (el.dataset.cursorBound) return;
            el.dataset.cursorBound = '1';
            el.addEventListener('mouseenter', () => ring.classList.add('hovered'));
            el.addEventListener('mouseleave', () => ring.classList.remove('hovered'));
          });
        }

        bindHovers();

        // Watch for dynamic DOM nodes (e.g. Swiper duplicates)
        const observer = new MutationObserver(bindHovers);
        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
</body>
</html>
